[config]

# Ryoku & Noctalia Master Matugen App Templates (All Apps Sync)

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-4.0/gtk.css"
post_hook = "gsettings set org.gnome.desktop.interface gtk-theme '' 2>/dev/null; gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark' 2>/dev/null; pkill -HUP xsettingsd 2>/dev/null || true"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/current-theme.conf"
post_hook = "pkill -SIGUSR1 kitty 2>/dev/null || true"

[templates.alacritty]
input_path = "~/.config/matugen/templates/alacritty.toml"
output_path = "~/.config/alacritty/colors.toml"

[templates.ghostty]
input_path = "~/.config/matugen/templates/ghostty.conf"
output_path = "~/.config/ghostty/config"

[templates.vesktop]
input_path = "~/.config/matugen/templates/discord.css"
output_path = "~/.config/vesktop/themes/matugen.css"

[templates.equibop]
input_path = "~/.config/matugen/templates/discord.css"
output_path = "~/.config/equibop/themes/matugen.css"

[templates.zen_chrome]
input_path = "~/.config/matugen/templates/zen-userChrome.css"
output_path = "~/.cache/noctalia/zen-browser/zen-userChrome.css"

[templates.zen_content]
input_path = "~/.config/matugen/templates/zen-userContent.css"
output_path = "~/.cache/noctalia/zen-browser/zen-userContent.css"
post_hook = "/home/amtia/.local/bin/sync-zen-theme.sh"


[templates.spicetify]
input_path = "~/.config/matugen/templates/spicetify.ini"
output_path = "~/.config/spicetify/Themes/Matugen/color.ini"
post_hook = "mkdir -p ~/.config/spicetify/Themes/Comfy 2>/dev/null && cp -f ~/.config/spicetify/Themes/Matugen/color.ini ~/.config/spicetify/Themes/Comfy/color.ini 2>/dev/null; spicetify apply 2>/dev/null || true"

[templates.fuzzel]
input_path = "~/.config/matugen/templates/fuzzel.conf"
output_path = "~/.config/fuzzel/fuzzel.ini"

[templates.cava]
input_path = "~/.config/matugen/templates/cava.ini"
output_path = "~/.config/cava/config"
post_hook = "pkill -USR2 cava 2>/dev/null || true"

[templates.fastfetch]
input_path = "~/.config/matugen/templates/fastfetch.jsonc"
output_path = "~/.config/fastfetch/config.jsonc"

[templates.zathura]
input_path = "~/.config/matugen/templates/zathura"
output_path = "~/.config/zathura/zathurarc"

[templates.micro]
input_path = "~/.config/matugen/templates/micro.micro"
output_path = "~/.config/micro/colorschemes/matugen.micro"

[templates.neovim_palette]
input_path = "~/.config/matugen/templates/colors.json"
output_path = "~/.cache/ryoku/colors.json"

[templates.obs]
input_path = "~/.config/matugen/templates/obs.theme"
output_path = "~/.config/obs-studio/themes/matugen.theme"

[templates.zed]
input_path = "~/.config/matugen/templates/zed.json"
output_path = "~/.config/zed/themes/matugen.json"

[templates.heroic]
input_path = "~/.config/matugen/templates/heroic.css"
output_path = "~/.config/heroic/store/styles/matugen.css"

[templates.telegram]
input_path = "~/.config/matugen/templates/telegram.tdesktop-theme"
output_path = "~/.local/share/TelegramDesktop/tdata/matugen.tdesktop-theme"

[templates.fish]
input_path = "~/.config/matugen/templates/colors.fish"
output_path = "~/.config/fish/conf.d/ryoku-colors.fish"

[templates.yazi]
input_path = "~/.config/matugen/templates/yazi.toml"
output_path = "~/.config/yazi/theme.toml"

[templates.obsidian]
input_path = "~/.config/matugen/templates/obsidian.css"
output_path = "~/.config/matugen/generated/obsidian.css"

[templates.kvantum]
input_path = "~/.config/matugen/templates/kvantum.kvconfig"
output_path = "~/.config/Kvantum/ryoku/ryoku.kvconfig"
post_hook = "mkdir -p ~/.config/Kvantum/ryoku && cp -f ~/.config/matugen/templates/kvantum.svg ~/.config/Kvantum/ryoku/ryoku.svg 2>/dev/null; kvantummanager --set ryoku 2>/dev/null || true"

[templates.qt6ct]
input_path = "~/.config/matugen/templates/qt6ct-colors.conf"
output_path = "~/.config/qt6ct/colors/ryoku.conf"

[templates.hyprland]
input_path = "~/.config/matugen/templates/hypr-colors.lua"
output_path = "~/.cache/ryoku/hypr-colors.lua"
post_hook = "hyprctl reload 2>/dev/null || true"

[templates.vscode]
input_path = "~/.config/matugen/templates/code.json"
output_path = "~/.vscode/extensions/noctalia.noctaliatheme-0.0.5-universal/themes/NoctaliaTheme-color-theme.json"
post_hook = "/home/amtia/.local/bin/sync-code-theme.sh"

[templates.antigravity]
input_path = "~/.config/matugen/templates/code.json"
output_path = "~/.antigravity/extensions/noctalia.noctaliatheme-0.0.5-universal/themes/NoctaliaTheme-color-theme.json"
post_hook = "/home/amtia/.local/bin/sync-code-theme.sh"
