# Matugen Theme for Yazi File Manager
[manager]
cwd = { fg = "{{colors.primary.default.hex}}" }

# Hovered and selected
hovered = { bg = "{{colors.surface_container_highest.default.hex}}", fg = "{{colors.on_surface.default.hex}}" }
preview_hovered = { underline = true }

# Find
find_keyword = { fg = "{{colors.primary.default.hex}}", bold = true, italic = true, underline = true }
find_position = { fg = "{{colors.tertiary.default.hex}}", italic = true }

# Marker
marker_copied = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }
marker_cut = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error_container.default.hex}}" }
marker_marked = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary_container.default.hex}}" }
marker_selected = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary_container.default.hex}}" }

# Tab
tab_active = { bg = "{{colors.primary.default.hex}}", fg = "{{colors.on_primary.default.hex}}" }
tab_inactive = { bg = "{{colors.surface_container.default.hex}}", fg = "{{colors.on_surface_variant.default.hex}}" }
tab_width = 1

# Count
count_copied = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
count_cut = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}" }
count_selected = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }

# Border
border_symbol = "│"
border_style = { fg = "{{colors.outline.default.hex}}" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "{{colors.surface_container_highest.default.hex}}", bg = "{{colors.surface_container_highest.default.hex}}" }

# Mode
mode_normal = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
mode_select = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}", bold = true }
mode_unset = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}", bold = true }

# Progress
progress_label = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_highest.default.hex}}" }
progress_error = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container_highest.default.hex}}" }

# Permissions
permissions_t = { fg = "{{colors.primary.default.hex}}" }
permissions_r = { fg = "{{colors.tertiary.default.hex}}" }
permissions_w = { fg = "{{colors.error.default.hex}}" }
permissions_x = { fg = "{{colors.secondary.default.hex}}" }
permissions_s = { fg = "{{colors.outline.default.hex}}" }

[filetype]
rules = [
    { mime = "image/*", fg = "{{colors.tertiary.default.hex}}" },
    { mime = "{audio,video}/*", fg = "{{colors.primary.default.hex}}" },
    { mime = "application/{zip,gzip,x-tar,x-bzip2,x-7z-compressed,x-rar,vnd.rar,x-xz,zstd}", fg = "{{colors.error.default.hex}}" },
    { url = "*", is = "orphan", fg = "{{colors.error.default.hex}}" },
    { url = "*", is = "exec", fg = "{{colors.secondary.default.hex}}" },
    { url = "*/", fg = "{{colors.primary.default.hex}}", bold = true },
    { url = "*", fg = "{{colors.on_surface.default.hex}}" }
]
