[main]
font=Space Grotesk:weight=medium:size=13
dpi-aware=auto
icons-enabled=yes
fields=filename,name,generic,exec,categories,keywords,comment
match-mode=fzf
sort-result=yes
filter-desktop=no
terminal=kitty -e {cmd}
lines=12
width=35
horizontal-pad=25
vertical-pad=15
inner-pad=8
image-size-ratio=0.5
line-height=26
layer=overlay
exit-on-keyboard-focus-loss=yes
enable-mouse=no


[colors]
background=fff9e7e6
text=1e1c0eff
prompt=884f20ff
placeholder=7d7858ff
input=924900ff
match=665e11ff
selection=92490080
selection-text=1e1c0eff
selection-match=ffffffff
counter=884f20ff
border=924900ff
