# Ryoku palette -> tmux. Rendered by matugen; do not edit.

set -g status-bg                          "#0d0e13"
set -gq @thm_bar_bg                       "#0d0e13"

set -gq @thm_bg                           "#131318"
set -gq @thm_fg                           "#e4e1e9"
set -gq @thm_primary                      "#bcc3ff"
set -gq @thm_inverse_primary              "#535a92"
set -gq @thm_surface_low                  "#1b1b21"
set -gq @thm_surface                      "#1f1f25"
set -gq @thm_surface_variant              "#29292f"
set -gq @thm_outline                      "#46464f"
set -gq @thm_text_variant                 "#c7c5d0"

# Re-set the options that read the vars above.
set -g status-style                       "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g window-active-style                "bg=#{@thm_bg},fg=#{@thm_fg}"
